<!doctype html>
<html lang="zh-CN" data-motion="paused"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>背景动画 · Zhenghao YU</title>
<link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../field.css"><link rel="stylesheet" href="studies.css">
<style>
body{min-height:100dvh;display:grid;align-items:center}
.flight-stage{margin:0;border-radius:0;aspect-ratio:8/3;width:100%;height:auto;max-height:100dvh;min-height:min(265px,100dvh);--stage-paper:white;--paper:white;--ink:#25302b}
.flight-film{scale:1}
.flight-fallback{justify-items:start;padding-left:5%}
.flight-stage :is(.flight-replay,.motion-toggle){position:absolute;bottom:6px;min-width:44px;min-height:38px;border:1px solid #d5dad7;font:13px/1.1 system-ui,sans-serif;z-index:1;border-radius:3px;background:#fff}
.flight-stage .flight-replay{left:8px;right:auto}.flight-stage .motion-toggle{right:8px;left:auto}
@media(max-width:620px){.flight-film{object-position:71% center}.flight-stage :is(.flight-replay,.motion-toggle){width:auto;min-width:46px;padding-inline:9px}}
</style></head><body>
<div class="flight-stage print-stage">
<video class="flight-film" muted playsinline preload="none" aria-hidden="true" width="1440" height="540" data-ink-map="../../assets/motion/grasp-ink.json"></video>
<p class="flight-fallback">Zhenghao YU</p><canvas id="flight-lettering" aria-hidden="true"></canvas>
<button class="flight-replay" type="button" hidden>重播</button><button class="motion-toggle" type="button">暂停</button>
</div>
<script>
  const key=new URLSearchParams(location.search).get('look');
  const study=['contours','eclipse','prism'].includes(key)?key:'contours';
  const video=document.querySelector('video');
  video.poster=study+'.webp';
  video.dataset.openingPoster=study+'-opening.webp';
  video.src=study+'.mp4';
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const toggle=document.querySelector('.motion-toggle');
  function motion(running) {
    document.documentElement.dataset.motion=running?'running':'paused';
    toggle.textContent=running?'暂停':'播放';
    toggle.setAttribute('aria-label',running?'暂停动画':'播放动画');
    document.dispatchEvent(new Event('site:motion'));
  }
  motion(!reduced.matches);
  toggle.addEventListener('click',()=>motion(document.documentElement.dataset.motion!=='running'));
  reduced.addEventListener('change',()=>motion(!reduced.matches));
</script>
<script src="../../field.js?v=particle-2"></script></body></html>
